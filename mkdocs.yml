site_name: Ranger docs
docs_dir: docs
# repo_url: <path-to-your-repo>
# edit_uri: edit/main/docs/

plugins:
  - techdocs-core
  - search

theme:
  name: material
  icon:
    edit: material/pencil
    view: material/eye
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/flame-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  features:
    - search.suggest
    # Disabling, but you can re-enable once you fix the repo_url and edit_uri above
    - content.action.edit
    - content.action.view

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - "Ranger overview": index.md
  - "Commit-based release notes generation":
    - "About commit-based release notes generation": ranger-commit-script/index.md
    - "How to run commit-based release notes generation": ranger-commit-script/how-to-run-script.md
  - "Version-based release notes generation":
    - "About version-based release notes generation": ranger-version-script/index.md
    - "How to run version-based release notes generation": ranger-version-script/how-to-run-script.md
  - Additional resources: guidance.md
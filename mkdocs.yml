site_name: LinkedIn Guide
docs_dir: docs
# repo_url: <path-to-your-repo>
# edit_uri: edit/main/docs/

plugins:
  - search

theme:
  name: material
  icon:
    edit: material/pencil
    view: material/eye
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/flame-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  features:
    - search.suggest
    - content.action.edit
    - content.action.view

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - "LinkedIn overview": index.md
  - "Apply to jobs with LinkedIn": 
    - "Set up your profile": apply/set-up-your-profile.md
    - "Add job preferences": apply/add-job-preferences.md
    - "Search for jobs": apply/search-for-jobs.md
    - "Apply for a job": apply/apply-for-jobs.md
    - "Track application progress": apply/track-application.md
  - "LinkedIn Premium features":
    - "What is LinkedIn Premium?": premium/index.md
    - "View analytics for a job posting": premium/view-analytics.md
    - "Mark a job as your Top Choice": premium/mark-job-as-top-choice.md
    - "Contact users outside your network with InMail": premium/contact-users-outside-network.md
    - "See who has viewed your profile": premium/see-who-viewed-profile.md
    - "Learn with LinkedIn Learning": premium/linkedIn-learning.md
  - "References":
    - "Intro and profile fields": references/intro-fields.md
    - "LinkedIn Standard vs Premium plans": references/linkedIn-premium-plans.md
    - "LinkedIn Learning": references/linkedIn-learning.md
    - "Job preferences": references/job-preferences.md
    - "Job categories": references/job-categories.md